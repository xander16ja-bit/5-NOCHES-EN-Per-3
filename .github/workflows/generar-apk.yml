name: Generar APK 5 Noches V4

on: [push, workflow_dispatch]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extraer juego
        run: unzip -q -o Juego_Cesar_Jared_V4.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon -p CincoNoches_Cesar_Jared :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Cinco-Noches-V4-APK
          path: CincoNoches_Cesar_Jared/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
